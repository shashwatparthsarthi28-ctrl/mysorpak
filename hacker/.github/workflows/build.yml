
name: Build Cyber Prank APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Friend APK
        run: gradle --no-daemon :friend-app:assembleDebug

      - name: Build Admin APK
        run: gradle --no-daemon :admin-app:assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: CyberPrank-APKs
          path: |
            friend-app/build/outputs/apk/debug/*.apk
            admin-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
